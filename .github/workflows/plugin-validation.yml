name: Plugin validation

on:
  push:
  pull_request:

jobs:
  plugins:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.7.1'
          use-dotnet: true
      - name: Install Python validation dependency
        run: python -m pip install PyYAML
      - name: Install pinned Godot MCP
        working-directory: plugins/godot-codex-studio/mcp
        run: npm ci --omit=dev --ignore-scripts
      - name: Validate plugins and contracts
        run: |
          python -m unittest discover -s plugins/ue5-codex-studio/tests -v
          python -m unittest discover -s plugins/godot-codex-studio/tests -v
          python plugins/ue5-codex-studio/scripts/validate_studio.py
          python plugins/godot-codex-studio/scripts/validate_studio.py
          python plugins/godot-codex-studio/scripts/sync_shared_contracts.py plugins/ue5-codex-studio --check
          python plugins/godot-codex-studio/scripts/sync_shared_contracts.py plugins/godot-codex-studio --check
          node plugins/godot-codex-studio/scripts/verify_upstream_mcp.mjs
          python plugins/godot-codex-studio/scripts/validate_godot_project.py plugins/godot-codex-studio/tests/fixtures/gdscript --godot godot
      - name: Validate C# fixture
        run: dotnet build plugins/godot-codex-studio/tests/fixtures/csharp/GodotFixture.csproj --nologo
